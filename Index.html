<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/index.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <title>Extender</title>
 
  <style>
    #uploadZone {
      background: #eee;
      padding: 20px;
      width: 100%;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .control-group {
      margin-top: 15px;
    }

    .control-group label {
      display: inline-block;
      margin-right: 12px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #canvas-container {
      margin-top: 20px;
    }

    canvas {
      max-width: 100% !important;
      height: auto !important;
      border: 1px solid #ccc;
      background-image: 
        linear-gradient(45deg, #e0e0e0 25%, transparent 25%), 
        linear-gradient(-45deg, #e0e0e0 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #e0e0e0 75%), 
        linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
  </style>
</head>

<body>
  <h1>Extender</h1>
  <p>Erweitert Bildränder um einen gewählten Bereich 
  und speichert das Ergebnis als "dateiname_ext" unter Downloads.</p>
  <p><a href="https://khz-66.github.io/" target="_blank">Homepage</a><br></p>

  <img src="extender.jpg" style="width: 100%; height: auto; max-width: 400px;">

  <div id="uploadZone">
    <div>
      <input id="fileInput" type="file" accept="image/*" multiple>
    </div>

    <div class="control-group">
      <strong>Seiten:</strong><br>
      <label><input type="checkbox" id="dirTop"> Oben</label>
      <label><input type="checkbox" id="dirBottom" checked> Unten</label>
      <label><input type="checkbox" id="dirLeft"> Links</label>
      <label><input type="checkbox" id="dirRight"> Rechts</label>
    </div>

    <div class="control-group">
      <label for="pixels"><strong>Erweiterung (Pixel):</strong></label>
      <input type="number" id="pixels" value="200" min="1" max="5000" style="width: 80px;">
    </div>

    <div class="control-group">
      <label for="bgMode"><strong>Hintergrund:</strong></label>
      <select id="bgMode">
        <option value="transparent" selected>Transparent (Alpha erhalten)</option>
        <option value="auto">Farbe automatisch vom Bildrand</option>
        <option value="custom">Eigene Farbe wählen</option>
      </select>
      <span id="colorPickerRow" style="display: none; margin-left: 10px;">
        <input type="color" id="bgColor" value="#ffffff">
      </span>
    </div>

    <div class="control-group">
      <button id="processBtn" disabled>Bilder bearbeiten & speichern</button>
    </div>

    <div id="status">Bitte wähle zuerst Bilder aus.</div>
  </div>

  <!-- Vorschau-Canvas -->
  <div id="canvas-container"></div>

  <script>
    let selectedFiles = [];
    let p5Canvas;

    function setup() {
      pixelDensity(1);
      p5Canvas = createCanvas(400, 150);
      p5Canvas.parent('canvas-container');
      noLoop();
      zeigeStartBildschirm();
    }

    function zeigeStartBildschirm() {
      background(240);
      fill(50);
      noStroke();
      textAlign(LEFT, TOP);
      textSize(13);
      text("1. Klicke auf 'Dateien auswählen'\n2. Wähle Seiten, Pixel und Hintergrund\n3. Klicke auf 'Bilder bearbeiten & speichern'", 20, 50);
    }

    document.getElementById('bgMode').addEventListener('change', function(e) {
      const colorRow = document.getElementById('colorPickerRow');
      colorRow.style.display = (e.target.value === 'custom') ? 'inline-block' : 'none';
    });

    document.getElementById('fileInput').addEventListener('change', function(event) {
      selectedFiles = Array.from(event.target.files);
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('processBtn');

      if (selectedFiles.length > 0) {
        const namesPreview = selectedFiles.map(f => f.name).join(', ');
        statusEl.style.color = '#0055aa';
        statusEl.innerText = `${selectedFiles.length} Datei(en) ausgewählt: ${namesPreview}`;
        btn.disabled = false;
      } else {
        statusEl.style.color = '#333';
        statusEl.innerText = 'Keine Bilder ausgewählt.';
        btn.disabled = true;
      }
    });

    document.getElementById('processBtn').addEventListener('click', async function() {
      if (selectedFiles.length === 0) return;

      const directions = {
        top: document.getElementById('dirTop').checked,
        bottom: document.getElementById('dirBottom').checked,
        left: document.getElementById('dirLeft').checked,
        right: document.getElementById('dirRight').checked
      };

      const statusEl = document.getElementById('status');

      if (!directions.top && !directions.bottom && !directions.left && !directions.right) {
        statusEl.style.color = '#cc0000';
        statusEl.innerText = 'Bitte wähle mindestens eine Seite (Oben, Unten, Links, Rechts).';
        return;
      }

      const btn = document.getElementById('processBtn');
      const addPixels = Math.max(1, parseInt(document.getElementById('pixels').value, 10) || 200);
      const bgMode = document.getElementById('bgMode').value;
      const manualColor = document.getElementById('bgColor').value;

      btn.disabled = true;
      statusEl.style.color = '#b36b00';

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        statusEl.innerText = `(\( {i + 1}/ \){selectedFiles.length}) ${file.name} wird bearbeitet…`;

        try {
          await processSingleImage(file, directions, addPixels, bgMode, manualColor);
          // Pause, damit der Browser die Downloads nicht blockiert
          await new Promise(r => setTimeout(r, 1400));
        } catch (err) {
          console.error(err);
          statusEl.style.color = '#cc0000';
          statusEl.innerText = `Fehler bei ${file.name}: ${err.message || err}`;
          await new Promise(r => setTimeout(r, 1000));
        }
      }

      statusEl.style.color = '#007700';
      statusEl.innerText = `Fertig! ${selectedFiles.length} Bild(er) gespeichert.`;
      btn.disabled = false;

      // Erfolgsanzeige
      resizeCanvas(400, 150);
      background(0, 120, 0);
      fill(255);
      textSize(14);
      textAlign(CENTER, CENTER);
      text(`Fertig! ${selectedFiles.length} Bilder erfolgreich konvertiert.`, width / 2, height / 2);
    });

    function buildOutputFilename(originalFilename, keepAlpha) {
      const lastDot = originalFilename.lastIndexOf('.');
      const baseName = lastDot > 0 ? originalFilename.substring(0, lastDot) : originalFilename;
      let ext = lastDot > 0 ? originalFilename.substring(lastDot + 1).toLowerCase() : 'png';
      if (ext === 'jpeg') ext = 'jpg';

      // Bei Transparenz immer PNG, sonst Original-Format behalten
      if (keepAlpha && (ext === 'jpg' || ext === 'jpeg')) {
        ext = 'png';
      }

      const mimeType = (ext === 'jpg') ? 'image/jpeg' :
                       (ext === 'webp') ? 'image/webp' : 'image/png';

      return { filename: `\( {baseName}_ext. \){ext}`, mimeType };
    }

    function processSingleImage(file, directions, addPixels, bgMode, manualColor) {
      return new Promise((resolve, reject) => {
        const fileURL = URL.createObjectURL(file);

        loadImage(fileURL,
          // Erfolg
          (img) => {
            try {
              let newW = img.width;
              let newH = img.height;
              let dx = 0, dy = 0;

              if (directions.left)  { newW += addPixels; dx = addPixels; }
              if (directions.right) { newW += addPixels; }
              if (directions.top)   { newH += addPixels; dy = addPixels; }
              if (directions.bottom){ newH += addPixels; }

              // Offscreen Graphics = viel stabiler bei großen Bildern
              const g = createGraphics(newW, newH);
              g.pixelDensity(1);

              if (bgMode === 'transparent') {
                g.clear();
              } else if (bgMode === 'auto') {
                const sx = (directions.right && !directions.left) ? img.width - 1 : 0;
                const sy = (directions.bottom && !directions.top) ? img.height - 1 : 0;
                const col = img.get(sx, sy);
                g.background(col);
              } else {
                g.background(manualColor);
              }

              g.image(img, dx, dy);

              // Kleine Vorschau
              const previewScale = Math.min(400 / newW, 150 / newH, 1);
              resizeCanvas(Math.max(200, newW * previewScale), Math.max(80, newH * previewScale));
              clear();
              image(g, 0, 0, width, height);

              const keepAlpha = (bgMode === 'transparent');
              const { filename, mimeType } = buildOutputFilename(file.name, keepAlpha);

              // Zuverlässiger Download über toBlob
              g.elt.toBlob((blob) => {
                URL.revokeObjectURL(fileURL);
                g.remove();

                if (!blob) {
                  reject(new Error('toBlob fehlgeschlagen (Bild evtl. zu groß)'));
                  return;
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                setTimeout(() => URL.revokeObjectURL(url), 2000);
                resolve();
              }, mimeType, 0.92);

            } catch (e) {
              URL.revokeObjectURL(fileURL);
              reject(e);
            }
          },
          // Fehler beim Laden
          (err) => {
            URL.revokeObjectURL(fileURL);
            reject(new Error('Bild konnte nicht geladen werden'));
          }
        );
      });
    }
  </script>
</body>
</html>
